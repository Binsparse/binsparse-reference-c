name: "CI"

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  checks:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - name: Checks
      uses: pre-commit/action@v3.0.0

  build:
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        include:
          - id: gcc-12
            cc:  gcc-12
            cxx: g++-12
          - id: clang
            cc:  clang
            cxx: clang++
    name: Build (${{ matrix.cc }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@v4
    - name: CMake
      run: |
        sudo apt-get update
        sudo apt-get install libhdf5-dev gcc-12 g++-12 clang
        cmake -B build
    - name: Build
      run: VERBOSE=true make -C build -j `nproc`
    - name: Archive Build
      run: tar -czf build.tar.gz build
    - uses: actions/upload-artifact@v4
      with:
        name: compliance-build-${{ matrix.id }}
        path: build.tar.gz
        retention-days: 1

  test:
    name: Test (${{ matrix.cc }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - id: gcc-12
            cc: gcc-12
          - id: clang
            cc: clang
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: compliance-build-${{ matrix.id }}
    - name: Restore Build
      run: tar -xzf build.tar.gz
    - name: Install Runtime Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libhdf5-dev
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        run-install: false
        global-cache: true
    - name: Matrix Tests
      run: ctest --test-dir ./build/test/bash
    - name: Compliance Tests
      env:
        BINSPARSE_BUILD_DIR: ${{ github.workspace }}/build
      run: ./test/compliance/run-binsparse-tests.sh -q
